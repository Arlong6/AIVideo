# ──────────────────────────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 鐵衛的逆襲 · 劍從天降的處決
# KOF/SF style: mage opens with total control, juggernaut shrugs it off and executes
# ──────────────────────────────────────────────────────────────────────────────
#
# 【幕一 · 法師壓制 Mage Dominates  0–4s】
#   Lux 開場就掌控節奏:光之束縛固定蓋倫,螢光奇點消耗,閃現拉開風箏。
#   蓋倫被束縛、挨了幾下,血條開始掉——看起來法師完全壓著打。
#
# 【幕二 · 鐵衛不退 The Juggernaut Won't Stop  4–7s】
#   束縛擋不住閃現——蓋倫無視控制,一次次閃現+突刺強行貼臉。
#   Lux 的閃現燒完了,被逼到角落,最後的束縛被突刺打斷。
#
# 【幕三 · 大絕收場 Ultimate Climax  7–11s】
#   蓋倫滿能量(start_mp=100)。貼身瞬間,DEMACIAN JUSTICE 巨劍從天而降——
#   slam 處決(30 傷害,一發致命)。鐵衛插劍入地,法師倒下。
#
#   注意:蓋倫大絕前「絕不放耗魔 special」(judgment/courage 會把 MP 打到 100 以下,
#   demacian_justice 需滿 MP 才放得出來)。只用 basic / cd / flash / advance / block。
#   slam 需貼身才命中 → 突進貼臉正好。Lux 滿血 30 HP 被 30 傷害大絕一發處決。
# ──────────────────────────────────────────────────────────────────────────────
name: "Garen's comeback — juggernaut executes the mage"
left: garen
right: lux
duration_ms: 13000
left_start_mp: 100        # 蓋倫滿能量 — demacian_justice 是收場,不靠中途累積

left_timeline:
  # ── 幕一:被壓制 — 頂著束縛與消耗前進 ──
  - {t: 600,  do: advance}            # 開場直壓
  - {t: 1100, do: advance}
  - {t: 1600, do: block}              # 防一手 light_binding #1 (hits ~1.0s 後)
  - {t: 2100, do: advance}            # 被束縛也要前進(root 擋移動 → 引擎吃掉,但意圖明確)
  - {t: 2700, do: "flash:in"}         # 無視束縛 — 閃現貼臉 (flash 無視 root)
  - {t: 3300, do: "attack:basic"}     # 第一次還手
  - {t: 3800, do: advance}
  # ── 幕二:鐵衛不退 — 燒掉 Lux 的閃現、逼進角落 ──
  - {t: 4300, do: "attack:cd"}        # decisive_strike 突刺 DASH 拉近 (cooldown, 免費)
  - {t: 4900, do: advance}
  - {t: 5400, do: block}              # 防 light_binding #2
  - {t: 5900, do: advance}
  - {t: 6300, do: "flash:in"}         # 第二次閃現 — Lux 閃現已燒完,逼到牆角
  - {t: 6900, do: advance}            # 確保貼身(slam 需 melee 射程)
  - {t: 7200, do: advance}
  # ── 幕三:大絕 — 劍從天降的處決 ──
  - {t: 7500, do: "cast:demacian_justice"}   # 大絕 — slam 三階段電影感 + KO
  - {t: 8600, do: idle}               # 插劍入地,沉默佇立
  - {t: 9600, do: idle}

right_timeline:
  # ── 幕一:法師壓制 — 束縛 + 風箏 + 消耗(只用免費 light_binding,保留戲份;
  #    lucent_singularity 耗魔但 Lux 不需要大絕,可自由使用)──
  - {t: 700,  do: "cast:light_binding"}      # 固定蓋倫 (免費 cooldown, root 1.5s)
  - {t: 1300, do: "cast:lucent_singularity"} # 螢光奇點消耗 (poke)
  - {t: 1900, do: "flash:back"}              # 拉開距離風箏
  - {t: 2500, do: retreat}
  - {t: 3100, do: "attack:basic"}            # 反手戳一下
  - {t: 3700, do: retreat}
  # ── 幕二:閃現燒完 — 還想控,但擋不住 ──
  - {t: 4200, do: "cast:light_binding"}      # 第二次束縛 (CD 好了)
  - {t: 4800, do: retreat}
  - {t: 5300, do: "cast:lucent_singularity"} # 最後的消耗
  - {t: 5900, do: retreat}
  - {t: 6500, do: retreat}                   # 被逼到角落,無處可逃
  - {t: 7100, do: "cast:light_binding"}      # 最後的束縛嘗試(被貼臉打斷)
  # 7.5s — 蓋倫大絕落下,處決
