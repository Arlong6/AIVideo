# ──────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 鐵衛突進，無處可逃
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   蓋倫不廢話，開場即閃現壓進拉克絲；她施展束縛，但蓋倫頂著傷繼續猛壓。
#   拉克絲閃現逃至右端邊界，連發螢光奇點試圖製造距離。
#   鋼鐵意志 vs 光之智慧——戰場瞬間蔓延整個競技場。
#
# 【第二幕 · 蓄勢  6.0–15.0s】
#   蓋倫決定性突刺劃出銀弧，再一次閃現強行貼臉；拉克絲失去閃現慌忙後撤。
#   審判旋轉將拉克絲逼至左側牆角，光之束縛的最後嘗試被突刺打斷。
#   兩人的HP都在交換傷害中跌落，但蓋倫的勢頭更猛。
#
# 【第三幕 · 衝突  15.0–22.0s】
#   拉克絲閃現重置距離，但蓋倫幾乎同步閃現追上；兩道閃光在戰場交錯。
#   連續三段突刺讓拉克絲的防線徹底潰散，HP條見底。
#   蓋倫最後的旋轉如山崩——勝負已定。
#
# 【終幕 · KO  22.0s+】
#   勝者：蓋倫。他插劍入地，沉默地望向倒下的法師。
# ──────────────────────────────────────────────────────────
