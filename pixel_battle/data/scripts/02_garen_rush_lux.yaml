# pixel_battle/data/scripts/02_garen_rush_lux.yaml
# Garen rushes down Lux, uses a special (tenacity buff when affordable) to power
# through CC, then finishes with Demacian Justice.
name: "Garen rushes down Lux"
left: garen
right: lux
left_script:
  - {do: advance,           until: "dist<=130"}
  - {do: "attack:basic",    until: skill_done}
  - {do: advance,           until: "dist<=120"}
  - {do: "attack:cd",       until: skill_done}   # decisive_strike — free, ready at start
  - {do: "attack:special",  until: skill_done}   # cast first affordable special
  - {do: advance,           until: "dist<=120"}
  - {do: "attack:basic",    until: skill_done}
  - {do: advance,           until: "dist<=110"}
  - {do: "attack:basic",    until: skill_done}
  - {do: "attack:ultimate", until: skill_done}   # demacian_justice
right_script:
  - {do: retreat,           until: "dist>=240"}
  - {do: "attack:cd",       until: skill_done}   # light_binding — root attempt
  - {do: "attack:basic",    until: skill_done}   # land a hit to build MP before first special
  - {do: retreat,           until: "dist>=230"}
  - {do: "attack:special",  until: skill_done}   # cast first affordable special
  - {do: retreat,           until: "dist>=235"}
  - {do: "attack:cd",       until: skill_done}
  - {do: "attack:special",  until: skill_done}   # cast first affordable special
  - {do: advance,           until: "dist<=120"}
  - {do: "attack:ultimate", until: skill_done}   # final_spark
