# ──────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 鐵衛突進
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–5.0s】
#   蓋倫不廢話，盾牌一撥，大腳踏地，鐵衛的衝鋒氣勢排山倒海。
#   拉克絲施展光之束縛試圖阻截，卻被蓋倫咬牙強行衝破。
#   蓋倫每一次突刺都帶著鐵衛的狂野氣勢壓進場。
#
# 【第二幕 · 蓄勢  5.0–13.0s】
#   蓋倫決定性突刺劃出銀色弧線，把拉克絲一次次壓制。
#   拉克絲用光之束縛與螢光奇點拼命反擊，但蓋倫頂著傷繼續衝。
#   鐵衛的意志力讓每道光束都無法阻擋他的前進。
#
# 【第三幕 · 衝突  13.0–20.0s】
#   蓋倫怒吼，審判之旋轉如鋼鐵颶風席捲拉克絲周圍。
#   拉克絲退無可退，基本攻擊只是螳臂擋車。
#   蓋倫的巨劍一次又一次落下，HP條急速歸零。
#
# 【終幕 · 終結  20.0s+】
#   蓋倫高舉決定性突刺，最後一擊如山崩落下。
#   拉克絲的防護罩在衝擊中粉碎，倒地瞬間裙擺揚起金粉。
#   勝者：蓋倫。他收劍，對跌倒的法師點頭致意。
# ──────────────────────────────────────────────────────────
