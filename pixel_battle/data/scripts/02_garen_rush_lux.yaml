# ──────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 鐵衛突進
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   蓋倫不廢話，盾牌一撥，大腳踏地，鐵衛的衝鋒氣勢排山倒海。
#   拉克絲施展光之束縛試圖阻截，卻被蓋倫咬牙強行衝破。
#   長距離的戰場優勢正在崩潰——她必須閃避。
#
# 【第二幕 · 蓄勢  6.0–10.0s】
#   蓋倫決定性突刺劃出銀色弧線，把拉克絲壓入牆角。
#   閃現！蓋倫的身影在光芒中暴起，直插拉克絲側翼。
#   拉克絲用閃現奪命逃脫，但已耗盡了寶貴的機動力。
#
# 【第三幕 · 衝突  10.0–12.5s】
#   蓋倫怒吼，審判之旋轉如鋼鐵颶風席捲拉克絲周圍。
#   拉克絲退無可退，光之基本攻擊只是螳臂擋車。
#   蓋倫的巨劍一次又一次落下，每一擊都伴隨金屬轟鳴。
#
# 【終幕 · 終結  12.5s+】
#   蓋倫高舉德瑪西亞之力……落！30點純粹的天罰傷害。
#   拉克絲的防護罩在衝擊中粉碎，倒地的瞬間裙擺揚起金粉。
#   勝者：蓋倫。他收劍，對跌倒的法師點頭致意。
# ──────────────────────────────────────────────────────────
