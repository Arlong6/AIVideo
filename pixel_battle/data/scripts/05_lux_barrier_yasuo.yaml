# ──────────────────────────────────────────────────────────
# 拉克絲 vs 亞索 — 光盾與斷劍
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–7.0s】
#   亞索如影向前衝，風刃連斬硬要突破拉克絲的防線。
#   拉克絲慌忙後退，棱鏡護盾在最後一刻撐開，擋下了致命一擊。
#   護盾碎裂的瞬間，金色光芒散落滿地——她還活著。
#
# 【第二幕 · 蓄勢  7.0–14.0s】
#   拉克絲趁亞索最後之息落空的空隙，光之束縛鎖鏈射出。
#   亞索被根定住三秒，只能眼睜睜看著拉克絲後撤、積蓄魔力。
#   螢光奇點在亞索腳邊引爆，HP的刻度以驚人速度歸零。
#
# 【第三幕 · 衝突  14.0–22.0s】
#   亞索拼盡最後的氣力衝上來，凜風再聚也只剩虛影。
#   拉克絲用基本光束逐漸蠶食，每一發都精準落在要害。
#   戰場上的風變得稀薄，亞索的步伐愈來愈沉。
#
# 【終幕 · 終結  22.0s+】
#   拉克絲深吸一口氣，祭出終極：最終閃光。
#   一道刺眼的白光橫貫戰場，亞索被掃落塵埃，再無反抗之力。
#   勝者：拉克絲。她收杖，護盾的殘影還在手邊輕輕旋轉。
# ──────────────────────────────────────────────────────────
