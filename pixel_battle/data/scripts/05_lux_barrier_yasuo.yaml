# ──────────────────────────────────────────────────────────
# 拉克絲 vs 亞索 — 光盾與斷劍
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   亞索如影向前衝，風刃連斬硬要突破拉克絲的防線。
#   拉克絲慌忙後退，光之束縛鎖鏈在最後一刻射出，鎖死亞索腳步。
#   束縛碎裂的瞬間，金色光芒散落滿地——他還沒到。
#
# 【第二幕 · 蓄勢  6.0–14.0s】
#   拉克絲趁亞索被縛的空隙，光之束縛一次次射出。
#   螢光奇點在周圍接連引爆，每道命中讓亞索的HP條急速歸零。
#   亞索揮刀反擊，但射程不足，只能看著光束命中。
#
# 【第三幕 · 衝突  14.0–22.0s】
#   拉克絲繼續退，束縛與奇點輪番轟炸。
#   亞索用鋼鐵之刃搏命反擊，但距離太遠，刃光消散在空氣中。
#   戰場上的風變得稀薄，亞索的步伐愈來愈沉。
#
# 【終幕 · 終結  22.0s+】
#   拉克絲深吸一口氣，光之束縛再次鎖死亞索。
#   螢光奇點最後一次引爆，亞索倒地，再無反抗之力。
#   勝者：拉克絲。她收杖，護盾的殘影在手邊輕輕旋轉。
# ──────────────────────────────────────────────────────────
