# ──────────────────────────────────────────────────────────
# 拉克絲 vs 亞索 — 光之盾與斷劍浪人
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   拉克絲開場即施展螢光盾，金色護盾撐開的瞬間亞索閃現衝入。
#   光之束縛鎖鏈立刻射出，鎖死亞索的腳步；拉克絲閃現退至右端重置陣線。
#   亞索掙脫束縛，鋼鐵之刃橫掃氣刃——戰場中央閃光殘影交疊。
#
# 【第二幕 · 蓄勢  6.0–15.0s】
#   拉克絲在競技場左右兩端往返，螢光奇點從遠距持續爆炸轟炸。
#   亞索連續橫斬推進，每次 sweeping_blade 衝刺都縮短距離；拉克絲閃現逃脫。
#   光之束縛再次命中，為拉克絲贏得足夠空間連發兩顆螢光奇點。
#
# 【第三幕 · 衝突  15.0–22.0s】
#   亞索放棄等待，連閃兩次強行衝進，sweeping_blade 終於接觸近身範圍。
#   拉克絲HP條急速下滑，但束縛與奇點的連環讓亞索也岌岌可危。
#   光束橫貫全場，亞索被掃中跌倒，拉克絲在邊緣驚險逃出勝利。
#
# 【終幕 · KO  22.0s+】
#   勝者：拉克絲。她收杖，護盾的殘影在她手邊緩緩消散。
# ──────────────────────────────────────────────────────────
