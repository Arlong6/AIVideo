# ──────────────────────────────────────────────────────────
# 玻璃板 vs 磚石手機 — 玻璃碎片與鐵甲之爭
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   玻璃板碎片橫掃全場，廣告彈窗在競技場各角落引爆；
#   磚石手機踏步閃現強行壓進，厚重機身硬要近身肉搏。
#   玻璃板及時閃現逃離，切換到競技場另一側繼續開槍。
#
# 【第二幕 · 蓄勢  6.0–16.0s】
#   兩人交替穿越戰場——磚石閃現追擊，玻璃板閃現逃脫。
#   玻璃板的磁場慢化技使磚石機身變得遲鈍，廣告風暴爆開。
#   磚石手機螺絲飛鏢精準命中，玻璃螢幕開始出現裂痕。
#
# 【第三幕 · 衝突  16.0–22.0s】
#   磚石閃現抵達左端邊界，玻璃板被逼至右側牆角；兩者距離驟然縮短。
#   玻璃板最後一輪廣告轟炸全力轟出，磚石螢幕開始閃爍抖動。
#   磚石手機頂住最後一波傷害，強行近身收割勝利。
#
# 【終幕 · KO  22.0s+】
#   勝者：磚石手機。玻璃板啪地砸落，螢幕爆碎。
# ──────────────────────────────────────────────────────────
