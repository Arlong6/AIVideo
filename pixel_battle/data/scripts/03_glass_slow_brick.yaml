# ──────────────────────────────────────────────────────────
# 玻璃板 vs 磚石手機 — 玻璃與磚石之爭
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   磚石手機踏步向前，厚重機身硬壓戰場。
#   玻璃板碎片橫掃，光芒劃出刺眼弧線。
#   雙方同步逼近，廣告彈窗與螺絲飛鏢接連爆開。
#
# 【第二幕 · 蓄勢  6.0–16.0s】
#   玻璃板連發散射積蓄能量，磁場慢化磚石機身。
#   磚石手機螺絲飛鏢精準命中，金屬碰撞聲此起彼落。
#   玻璃板的魔力條悄悄注滿，廣告風暴蓄勢待發。
#
# 【第三幕 · 衝突  16.0–22.0s】
#   玻璃板廣告轟炸接連爆開，磚石手機疲於應對。
#   磚石手機強撐螺絲反擊，但玻璃板的散射源源不絕。
#   裂縫愈來愈深，磚石螢幕開始閃爍抖動。
#
# 【終幕 · 終結  22.0s+】
#   玻璃板最後一輪廣告+散射連擊，磚石手機螢幕熄滅。
#   啪地砸地，任憑螢幕玻璃爆碎。
#   勝者：玻璃板。它滑動解鎖，顯示「WINNER」。
# ──────────────────────────────────────────────────────────
