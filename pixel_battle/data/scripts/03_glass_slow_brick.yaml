# ──────────────────────────────────────────────────────────
# 玻璃板 vs 磚石手機 — 玻璃與磚石之爭
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   磚石手機以頭搥起手，厚重的機身硬碰硬地壓進戰場。
#   玻璃板後撤一步，碎玻璃散射技射出——試探距離、鋪設陷阱。
#   廣告視窗轟炸與螺絲飛鏢交織，金屬碰撞聲此起彼落。
#
# 【第二幕 · 蓄勢  6.0–12.0s】
#   玻璃板收到磚石蠻衝，激活手機震動衝擊波反擊。
#   磚石手機亮出終極招式「摔不壞拋擲」，空氣中炸開一聲金屬悶響。
#   玻璃板抖了抖，裂縫在邊框蔓延——但沒有倒。
#
# 【第三幕 · 衝突  12.0–20.0s】
#   玻璃板步步緊逼，碎片連射把磚石手機壓制住。
#   廣告彈出垃圾訊息接連爆開，讓磚石手機疲於應對。
#   磚石手機強撐蛇形突刺，打出最後的反擊——但已油盡燈枯。
#
# 【終幕 · 終結  20.0s+】
#   玻璃板引爆強制更新光束，一道蒼白射線橫貫整個戰場。
#   磚石手機螢幕熄滅，啪地一聲砸在地上，任憑螢幕玻璃爆碎。
#   勝者：玻璃板。它滑動解鎖，顯示「WINNER」。
# ──────────────────────────────────────────────────────────
