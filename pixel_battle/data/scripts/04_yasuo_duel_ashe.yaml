# ──────────────────────────────────────────────────────────
# 亞索 vs 艾希 — 浪人與冰冷弓矢
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   亞索斗笠低垂，大步逼近，風刃隨手揮出——輕鬆寫意，暗藏殺機。
#   艾希彎弓搭箭，冰霜箭矢在空氣中留下白色軌跡。
#   兩人同步接近，戰場中央積累著濃烈的殺意。
#
# 【第二幕 · 蓄勢  7.0–15.0s】
#   亞索加快鋼鐵之刃的節奏，弧形氣刃一浪接一浪衝出。
#   艾希箭雨連發，冰霜箭矢打在亞索身上，他卻面不改色。
#   鋼刃與箭雨在近戰區域激烈交鋒，雙方都受傷不輕。
#
# 【第三幕 · 衝突  15.0–22.0s】
#   亞索凌空突刺，每一劍都比前一劍更快更狠。
#   艾希聚焦射擊，拉滿的弓弦再也撐不住壓力。
#   亞索的狂攻讓艾希開始感到後繼無力，HP條急速歸零。
#
# 【終幕 · 終結  22.0s+】
#   亞索最後的斬擊橫貫戰場，鋼刃應聲命中。
#   艾希應聲倒地，冰弓滑落，戰場歸於死寂的冷風。
#   勝者：亞索。他回收長劍，斗笠下帶著淡漠。
# ──────────────────────────────────────────────────────────
