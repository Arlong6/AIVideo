# ──────────────────────────────────────────────────────────
# 亞索 vs 艾希 — 浪人橫斬，冰箭追逐
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   亞索斗笠低垂，鋼鐵之刃劃出弧形氣刃衝過競技場；直接閃現貼臉。
#   艾希彎弓搭箭，萬箭齊發瞬間覆蓋半個戰場；閃現退至右端邊界。
#   兩道特效在空中交錯——第一次接觸電光石火，雙方都受傷。
#
# 【第二幕 · 蓄勢  6.0–15.0s】
#   亞索連續橫斬推進，sweeping_blade 衝刺跨越整個戰場；艾希連連後閃。
#   艾希在左端落腳，鷹眼偵查鎖定亞索，冰霜箭雨持續輸出。
#   亞索閃現衝入射程，冰霜減速讓他步伐一頓，但他仍不停追。
#
# 【第三幕 · 衝突  15.0–22.0s】
#   亞索最後一次閃現越過艾希身後，切斷她的退路；sweeping_blade 收割爆發。
#   艾希聚焦射擊拼命反殺，弓弦崩斷之際 HP 條見底。
#   一刀橫掃，艾希仰面倒地，冰弓墜落，戰場歸於冷風。
#
# 【終幕 · KO  22.0s+】
#   勝者：亞索。他收劍，斗笠下帶著淡漠，風吹過散落的箭羽。
# ──────────────────────────────────────────────────────────
