# ──────────────────────────────────────────────────────────
# 亞索 vs 艾希 — 浪人與冰冷弓矢
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   亞索斗笠低垂，風刃隨意揮出——輕鬆寫意，卻暗藏殺機。
#   艾希彎弓搭箭向後退，冰霜箭矢在空氣中留下白色軌跡。
#   雙方試探拉鋸，誰也不急著打出底牌。
#
# 【第二幕 · 蓄勢  6.0–9.0s】
#   鋼鐵之刃！亞索的灼熱旋風向前衝出，弧形氣刃破空而至。
#   艾希閃現後退試圖甩開，箭雨齊射只是擦邊而過。
#   亞索閃現追上，連刃不停——他不給敵人喘息的機會。
#
# 【第三幕 · 衝突  9.0–10.5s】
#   凜風聚刃斬再次引爆，艾希的冰霜護甲在旋風中崩解。
#   艾希掙扎起身，聚焦射擊造成最後的反擊——徒勞。
#   亞索摺扇一收，踏步上前，眼神平靜如風前之眼。
#
# 【終幕 · 終結  10.5s+】
#   最後一聲吹風：最後之息。亞索瞬間橫越戰場，劍氣橫貫。
#   艾希應聲倒地，冰弓滑落，戰場歸於死寂的冷風。
#   勝者：亞索。他回收長劍，斗笠下的嘴角帶著一絲淡漠。
# ──────────────────────────────────────────────────────────
