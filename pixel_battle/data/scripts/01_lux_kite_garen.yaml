# ──────────────────────────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 魔法師的護盾、突刺追擊與光之終幕
# ──────────────────────────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–8.0s】
#   蓋倫閃現壓入，「決意一擊」衝刺斬穿距離直擊拉克絲。
#   拉克絲在受創後施展「棱鏡護障」護盾，並以「光之鎖鏈」束縛蓋倫。
#   蓋倫頂著束縛繼續追擊，護盾在連擊中耗盡。
