# ──────────────────────────────────────────────────────────
# 拉克絲 vs 蓋倫 — 風箏與追擊
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   蓋倫抬起巨劍,鐵靴踏地轟鳴,氣勢如山地壓進場。
#   拉克絲足尖輕點,向後滑退，光之法杖泛起淡金流光。
#   她需要距離——這場仗不能讓對手靠近。
#
# 【第二幕 · 蓄勢  6.0–10.0s】
#   《光之束縛》如金色鎖鏈驟然射出，蓋倫腳步一頓——
#   被束縛住的瞬間，蓋倫咬緊牙關眼眸中殺意翻湧。
#   拉克絲趁機閃身後撤，積蓄著決定性一擊的能量。
#
# 【第三幕 · 衝突  10.0–13.0s】
#   蓋倫祭出閃現瞬移切入，大劍的風壓讓拉克絲踉蹌。
#   電光火石間，決定性突刺的銀芒劃過——傷！
#   拉克絲被迫近戰應對，卻在危機中迎來最後的機會。
#
# 【終幕 · 終結  13.0s+】
#   拉克絲引爆殘餘MP，近距離一連串基本攻擊如暴雨般落下。
#   蓋倫單膝跪地，巨劍砸入塵土，身形轟然倒塌。
#   勝者：拉克絲。光芒在她手中最後一次閃滅。
# ──────────────────────────────────────────────────────────
