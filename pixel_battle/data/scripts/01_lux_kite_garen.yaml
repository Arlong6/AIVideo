# pixel_battle/data/scripts/01_lux_kite_garen.yaml
# Lux genuinely kites: opens at 270 px with light_binding root, retreats when
# Garen closes, flashes back to re-establish range, then fires Final Spark.
# Winner: Lux (right). Finisher: close-range basic spam until Garen KO'd.
name: "Lux kites and roots Garen"
left: garen
right: lux
left_script:
  # Garen rushes in and swings; uses Flash to close when Lux retreats far
  - {do: advance,           until: "dist<=130"}
  - {do: "attack:basic",    until: skill_done}
  - {do: advance,           until: "dist<=120"}
  - {do: "attack:cd",       until: skill_done}    # decisive_strike — free at start
  - {do: advance,           until: "dist<=120"}
  - {do: "attack:basic",    until: skill_done}    # build MP
  - {do: "flash:in",        until: "dist<=130"}   # close the gap when Lux retreats
  - {do: "attack:cd",       until: skill_done}    # decisive_strike again
  - {do: advance,           until: "dist<=120"}
  - {do: "attack:basic",    until: skill_done}
  - {do: advance,           until: "dist<=110"}
  - {do: "attack:special",  until: skill_done}    # judgment / courage
  - {do: advance,           until: "dist<=110"}
  - {do: "attack:ultimate", until: skill_done}    # demacian_justice (dmg=30)
  - {do: advance,           until: "dist<=110"}
  - {do: "attack:basic",    until: "target_hp<=0"}
right_script:
  # Lux opens at long range, roots Garen, re-establishes distance with Flash
  - {do: retreat,           until: "dist>=270"}
  - {do: "attack:cd",       until: skill_done}    # light_binding roots at 280 px
  - {do: retreat,           until: "dist>=280"}
  - {do: "attack:basic",    until: skill_done}    # build MP
  - {do: retreat,           until: "dist>=290"}
  - {do: "attack:special",  until: skill_done}    # lucent_singularity at 300 px
  - {do: "flash:back",      until: "dist>=250"}   # escape when Garen closes
  - {do: retreat,           until: "dist>=270"}
  - {do: "attack:cd",       until: skill_done}    # light_binding again
  - {do: retreat,           until: "dist>=280"}
  - {do: "attack:special",  until: skill_done}    # lucent_singularity
  - {do: "flash:back",      until: "dist>=250"}
  - {do: retreat,           until: "dist>=280"}
  - {do: "attack:ultimate", until: skill_done}    # final_spark at 340 px
  # --- Finisher: close in and spam basics until Garen KO'd ---
  - {do: advance,           until: "dist<=100"}
  - {do: "attack:basic",    until: "target_hp<=0"}
  - {do: advance,           until: "dist<=100"}
  - {do: "attack:cd",       until: "target_hp<=0"}
  - {do: advance,           until: "dist<=100"}
  - {do: "attack:basic",    until: "target_hp<=0"}
  - {do: advance,           until: "dist<=100"}
  - {do: "attack:basic",    until: "target_hp<=0"}
  - {do: advance,           until: "dist<=100"}
  - {do: "attack:cd",       until: "target_hp<=0"}
  - {do: advance,           until: "dist<=100"}
  - {do: "attack:basic",    until: "target_hp<=0"}
