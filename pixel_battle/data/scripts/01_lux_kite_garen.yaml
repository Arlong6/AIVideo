# 【第二幕 · 風箏  8.0–16.0s】
#   拉克絲閃現後撤至右側邊界，維持距離並發射「螢光奇點」。
#   蓋倫蹲下閃過「終極聖光」光束 — MISS！
#   蓋倫反覆閃現追擊，「決意一擊」再次突入，持續積累 MP。
#
# 【第三幕 · 高潮  16.0–22.0s】
#   蓋倫「德瑪西亞的正義」降臨，拉克絲 HP 歸零。
#
# 【終幕 · KO  22.0s+】
#   勝者：蓋倫。踏過碎裂法杖。
# ──────────────────────────────────────────────────────────────────────────────
