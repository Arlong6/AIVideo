# ──────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 閃現突擊與光之風箏
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   蓋倫盾牌一揮，鐵靴踏地，直接閃現壓入拉克絲臉前；
#   拉克絲慌忙閃現逃回右側邊緣，光之法杖即刻射出束縛鎖鏈。
#   戰場中央留下蓋倫的劍印，鎖鏈金光在空氣中閃爍。
#
# 【第二幕 · 蓄勢  6.0–15.0s】
#   蓋倫再次閃現強行縮短距離，審判旋轉如鋼鐵颶風席捲；
#   拉克絲連放螢光奇點，每道爆炸都逼退蓋倫一步。
#   她閃現繞到左側，持續用光之束縛牽制——距離就是她的生命。
#
# 【第三幕 · 衝突  15.0–22.0s】
#   蓋倫咬牙突刺，鐵衛的意志壓倒一切；拉克絲HP條急速歸零。
#   她最後一次閃現逃離，但蓋倫早預判路線，決定性突刺橫截攔截。
#   光芒在碰撞瞬間碎裂——拉克絲轟然倒地。
#
# 【終幕 · KO  22.0s+】
#   勝者：蓋倫。鐵衛收劍，踏過碎裂的法杖殘骸，低頭默示。
# ──────────────────────────────────────────────────────────
