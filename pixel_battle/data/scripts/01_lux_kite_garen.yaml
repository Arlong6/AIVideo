# ──────────────────────────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 法師風箏 · 劍士防禦 · 大絕收場
# KOF/SF style: swordsman flash-rushes in, mage roots + kites + ultimate climax
# ──────────────────────────────────────────────────────────────────────────────
#
# 【幕一 · 試探 + 固定 Probe & Root  0–4s】
#   Lux fires light_binding at t=2.3s (root 1500ms on Garen).
#   Garen BLOCKS the root hit (block fires t=2.2s, active until t=2.7s).
#   Garen flash:in at t=2.7s (teleports to x≈280, Lux at x≈420, dist≈140).
#   ROOT expires t≈3.96s. Garen decisive_strike at t=4.1s closes to ~80px.
#
# 【幕二 · 貼身肉搏 Close Exchange  4–14s】
#   Dense basics at 80-100px distance. Both take regular hits.
#   Lux fires light_binding x2 more at CD windows (t≈6.5/10.5s, 固定).
#   Garen BLOCKS light_binding #2 (block fires t=6.5s, active during hit).
#   Light_binding #3 connects (Garen busy attacking at ~t=11s).
#   By t=14s Lux should have ~90-96 MP from hits × 12 + taken × 6.
#
# 【幕三 · 大絕收場 Ultimate Climax  14–20s】
#   final_spark fires when MP≥100 (~t=14.6s). Garen still has 8+ HP → KO!
#   Slow-mo triggers on the pre-KO blow (final_spark deals 32 dmg).
# ──────────────────────────────────────────────────────────────────────────────
