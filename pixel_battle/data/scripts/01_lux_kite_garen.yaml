# ──────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 閃現突擊、格擋與光之風箏
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–6.0s】
#   拉克絲率先出手，射出束縛鎖鏈；蓋倫格盾前擋、吃下 30% 傷害，
#   隨即閃現壓入，鐵衛突刺正面轟入。
#   拉克絲慌忙閃現逃回右側邊緣，光之法杖即刻再度射出奇點爆炸。
#
# 【第二幕 · 蓄勢  6.0–12.0s】
#   蓋倫閃現縮距，拉克絲閃現應對並發出閃爍奇點——
#   蓋倫輕蹲讓過光束，一道 MISS 光效劃過頭頂，隨後反身突刺。
#   拉克絲不斷用束縛牽制，蓋倫強行格擋，繼續壓步。
#
# 【第三幕 · 衝突  12.0–20.0s】
#   拉克絲蓄力終極技——終極聖光橫掃整個戰場；
#   蓋倫迅速閃現後退 + 蹲下，光束從頭頂掠過，再次 MISS！
#   蓋倫咬牙反攻，連段突刺 + 審判旋轉狂轟爛炸，
#   拉克絲 HP 條急速歸零。
#
# 【終幕 · KO  20.0s+】
#   勝者：蓋倫。鐵衛收劍，踏過碎裂的法杖殘骸，低頭默示。
# ──────────────────────────────────────────────────────────
