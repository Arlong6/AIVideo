# ──────────────────────────────────────────────────────────
# 蓋倫 vs 拉克絲 — 風箏與追擊
# ──────────────────────────────────────────────────────────
# 【第一幕 · 開場  0.0–5.0s】
#   蓋倫抬起巨劍，鐵靴踏地轟鳴，氣勢如山地壓進場。
#   拉克絲足尖輕點，向後滑退，光之法杖泛起淡金流光。
#   她需要距離——這場仗不能讓對手靠近。
#
# 【第二幕 · 蓄勢  5.0–14.0s】
#   《光之束縛》如金色鎖鏈驟然射出，蓋倫腳步一頓——
#   被束縛住的瞬間，蓋倫咬緊牙關，眼眸中殺意翻湧。
#   拉克絲趁機後撤，積蓄著螢光奇點的魔力。
#
# 【第三幕 · 衝突  14.0–22.0s】
#   蓋倫決定性突刺再次劃出弧線，瞬間縮短了距離。
#   拉克絲連放束縛與奇點，每道光芒都精準落在要害。
#   蓋倫的HP在光之連擊下急速歸零，步伐愈來愈沉。
#
# 【終幕 · 終結  22.0s+】
#   拉克絲引爆全部魔力，螢光奇點再次引爆。
#   蓋倫的巨劍砸入塵土，身形轟然倒塌。
#   勝者：拉克絲。光芒在她手中最後一次閃滅。
# ──────────────────────────────────────────────────────────
